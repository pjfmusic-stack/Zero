# Reverse-proxy snippet for self-hosted Zero behind nginx.
#
# The AI chat sidebar (apps/mail/components/ui/ai-sidebar.tsx) does NOT use
# tRPC. `useAgent`/`useAgentChat` from `agents/ai-react` open a WebSocket to
#   wss://<VITE_PUBLIC_BACKEND_URL>/agents/zero-agent/<connectionId>
# which is served by `agentsMiddleware` in apps/server/src/main.ts. If nginx
# only proxies `/api/`, this path 404s at nginx and the chat never answers.
#
# Include this inside the `server { ... }` block that fronts the Worker.
# Adjust `proxy_pass` if `wrangler dev` listens elsewhere than 127.0.0.1:8787.

location /agents/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
